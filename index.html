<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Tarjeta de Producto</title>
  <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>

  <div class="card">
    <img src="Resources/images (1).jpg" alt="Producto">

    <div class="card-content">
      <h2>Producto</h2>
       <p class="parrafo">NIKE SACAI</p>
    </div>

    <button>Comprar</button>
  </div>

  <div class="form-container">
    <h2>Contacto</h2>

    <form>
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Tu nombre">
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" placeholder="Tu apellido">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Correo</label>
          <input type="email" id="email" placeholder="Tu correo">
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" placeholder="Tu teléfono">
        </div>
      </div>

      <div class="form-group full-width">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje"></textarea>
      </div>

      <button type="submit">Enviar</button>
    </form>
  </div>
    <h2> Testimonial</h2>

    <div class="testimonial">
      <img src="Resources/Jake_Sully_ATWOW.PNG.webp" alt="Avatar" class="avatar">
      <div class="testimonial-content">
        <p>"Excelente servicio, superó mis expectativas. Lo recomiendo totalmente."</p>
        <h4>Jesús David</s></h4>
        <span>Cliente Satisfecha</span>
      </div>
    </div>
  </section>


</body>

</html>
