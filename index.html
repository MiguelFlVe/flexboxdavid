<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/styles.css">
  <title>Flexbox</title>
</head>

<body>
  <section>
    <h1 class="galery-title">
      Algunos de nuestros productos
    </h1>

    <div class="galery">
      <div class="galery__card galery__card--kyrie-7"></div>
      
      <div class="galery__card galery__card--low-4"></div>

      <div class="galery__card galery__card--kyrie-5"></div>

      <div class="galery__card galery__card--kyrie-irving-6"></div>

      <div class="galery__card galery__card--kyrie-low-4"></div>

      <div class="galery__card galery__card--kyrie-irving-8"></div>
    </div>
  </section>

  <section class="to-do-list">
    <h1 class="to-do-list__title">
      Tareas pendientes
    </h1>

    <ul class="to-do-list__list">
      <li class="to-do-list__item">Compra de más productos</li>

      <li class="to-do-list__item">Promoción de productos</li>

      <li class="to-do-list__item">Actualizar inventario</li>

      <li class="to-do-list__item">Revisar precios</li>

      <li class="to-do-list__item">Organizar el almacén</li>

      <li class="to-do-list__item">Distribución de productos</li>
    </ul>
  </section>
</body>

</html>
